<meta name="description" content="Portafolio profesional de Jorge Eduardo Paisano González, estudiante de Licenciatura en Psicología: proyectos, experiencia y currículum.">

<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14212e;--mut:#566577;--pri:#15324d;--acc:#1f8f8a;--gold:#c8963e;--line:#dde4ec;--soft:#e8eef5;--navy:#12304a;--navy2:#1c4a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1621;--card:#142130;--ink:#e8eef5;--mut:#9fb0c2;--pri:#9cc3e8;--acc:#4cc1ba;--gold:#e3b765;--line:#243445;--soft:#192a3b}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}a{color:inherit}.w{max-width:1120px;margin:0 auto;padding:0 22px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;white-space:nowrap}.mk{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:1.05rem}
nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;overflow-x:auto}
nav a.l{display:block;padding:7px 13px;border-radius:20px;text-decoration:none;font-size:.9rem;color:var(--mut);white-space:nowrap;transition:background .2s}
nav a.l:hover{background:var(--soft)}nav a.l.on{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:30px;padding:12px 24px;font:600 .95rem var(--sans);cursor:pointer;text-decoration:none;background:var(--navy);color:#fff;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(18,48,74,.25)}.btn.g{background:var(--gold);color:#1b1305}.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hero .btn.o{color:#fff;border-color:rgba(255,255,255,.45)}
.hero{background:linear-gradient(135deg,#0e2740 0%,var(--navy2) 58%,#1f8f8a 130%);color:#fff;position:relative;overflow:hidden;padding:64px 0 110px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1px,transparent 1.5px) 0 0/26px 26px}
.hg{position:relative;display:grid;gap:40px;align-items:center}@media(min-width:900px){.hg{grid-template-columns:1.2fr 1fr}}
.hello{display:inline-block;padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.12);font-size:.85rem;letter-spacing:.04em}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.4rem);letter-spacing:-.02em;margin:14px 0 6px}.hero h1 em{color:#e3b765;font-style:italic}
.tit{font-family:var(--serif);font-size:1.35rem;opacity:.95}.lead{font-size:1.15rem;color:rgba(255,255,255,.82);max-width:34em;margin:16px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:5px 14px;border-radius:20px;background:var(--soft);font-size:.86rem}.hero .chip{background:rgba(255,255,255,.13);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
.pw{position:relative;max-width:380px;margin:auto;width:100%}.pw .art{position:absolute;inset:-14% -18%;opacity:.9}
.pf{position:relative;aspect-ratio:4/5;border-radius:30px;overflow:hidden;box-shadow:0 0 0 6px rgba(255,255,255,.14),0 26px 50px rgba(0,0,0,.35);background:#2a4a66;display:grid;place-items:center;text-align:center;color:#e3b765;font-weight:600}
.pf img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
.stats{position:relative;margin-top:-58px;z-index:2}.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:800px){.sg{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 10px 26px rgba(18,48,74,.1);display:flex;gap:12px;align-items:center}
.st .ic{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:1.3rem;flex:none}.st b{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1}.st span{font-size:.82rem;color:var(--mut)}
section{padding:84px 0}.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
h2{font-size:clamp(1.9rem,4vw,2.6rem);margin:6px 0 10px}.sub{color:var(--mut);max-width:40em;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.about{display:grid;gap:26px}@media(min-width:900px){.about{grid-template-columns:1fr 1.15fr}}
.qc{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;border:0;position:relative;overflow:hidden}.qc q{font-family:var(--serif);font-size:1.55rem;line-height:1.32;display:block;position:relative}.qc q:before,.qc q:after{content:""}
.qc .mind{position:absolute;right:-30px;bottom:-40px;width:210px;opacity:.5}
.fil{margin-top:18px}.fil h3{font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}.fil svg{color:var(--gold)}
.g2{display:grid;gap:14px;margin-top:20px}@media(min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}}
.val{display:flex;gap:14px;align-items:center;padding:18px}.val .ic{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:1.4rem;flex:none}.val h3{font-size:1.05rem}
.ph{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(200,150,62,.14) 6px 12px);border:1.5px dashed var(--gold);border-radius:8px;padding:2px 8px;color:#9a6c1d;font-size:.92em}
@media(prefers-color-scheme:dark){.ph{color:#e3b765}}
.band{background:var(--soft)}
.tl{position:relative;margin-left:22px;padding-left:34px;border-left:2px solid var(--line)}
.ev{position:relative;margin-bottom:22px}.ev .dot{position:absolute;left:-58px;top:16px;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1.25rem;border:4px solid var(--soft)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 11px;border-radius:20px;background:var(--navy);color:#fff;margin:0 6px 4px 0}.tag.b{background:var(--soft);color:var(--ink)}
.ev h3{font-size:1.25rem;margin:6px 0 2px}.per{color:var(--mut);font-size:.92rem}ul.b{margin:8px 0;padding-left:20px}ul.b li{margin:3px 0}
.pg{display:grid;gap:20px}@media(min-width:760px){.pg{grid-template-columns:repeat(2,1fr)}}
.pc{border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:left;padding:0;font:inherit;color:inherit}
.pc:hover,.pc:focus-visible{transform:translateY(-5px);box-shadow:0 18px 36px rgba(18,48,74,.18)}
.cv{height:170px;display:grid;place-items:center;position:relative}.cv svg{width:88%;height:88%}
.pb{padding:18px 22px 22px;display:flex;flex-direction:column;gap:9px;flex:1}.pb h3{font-size:1.28rem}.pb p{margin:0;color:var(--mut);font-size:.95rem}.more{margin-top:auto;color:var(--acc);font-weight:600;font-size:.92rem}
dialog{border:0;border-radius:24px;padding:0;max-width:880px;width:calc(100% - 24px);max-height:90vh;background:var(--bg);color:var(--ink)}dialog::backdrop{background:rgba(8,18,28,.65)}
.dh{position:sticky;top:0;z-index:2;padding:20px 26px;color:#fff;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dh h2{font-size:1.6rem;margin:0}
.x{background:rgba(255,255,255,.25);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.db{padding:6px 26px 28px}.db h3{font-size:1.1rem;color:var(--pri);margin:24px 0 6px}.db h3 span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font:600 .8rem var(--sans);margin-right:8px}
.gal2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px}
.cvg{display:grid;gap:20px}@media(min-width:900px){.cvg{grid-template-columns:.8fr 1.6fr}}
.cvph{width:170px;aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:16px;background:var(--navy);display:grid;place-items:center;color:#e3b765;box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--gold)}.cvph img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
.cvg h3{font-size:1.05rem;color:var(--pri);margin:0 0 8px;display:flex;align-items:center;gap:8px}.cvg h3 svg{color:var(--gold)}.cvg .card{margin-bottom:14px}.cvg p{margin:2px 0}
.ct{background:linear-gradient(135deg,#0e2740,var(--navy2));color:#fff}.ct h2{color:#fff}.cg{display:grid;gap:30px;align-items:start}@media(min-width:900px){.cg{grid-template-columns:1fr 1.2fr}}
.cl{display:flex;gap:14px;align-items:center;margin:16px 0}.cl .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:1.3rem;color:#e3b765;flex:none}.cl a{text-decoration:none;font-weight:600}.cl small{display:block;opacity:.75;font-weight:400}
form{display:grid;gap:12px;color:var(--ink)}input,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--ink)}label{font-size:.85rem;font-weight:600}
footer{padding:28px 0;color:var(--mut);font-size:.88rem;background:var(--card);border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.btn,.pc{transition:none}}
@media(max-width:700px){section{padding:60px 0}body{font-size:16px}nav .logo span{display:none}.hero{padding:40px 0 100px}.tl{margin-left:16px;padding-left:28px}.ev .dot{left:-52px;width:42px;height:42px}}

sobre:{
 frase:"Creo de verdad que el cambio es real, y será un gusto acompañarle en ese proceso.",
 texto:["Soy estudiante de Licenciatura en Psicología en la Universidad Latinoamericana de Ciencia y Tecnología (ULACIT). Mi formación incluye el bachillerato en Psicología en la Universidad Autónoma de Centroamérica y en ULACIT, y he elaborado y ejecutado talleres con poblaciones infantiles, juveniles, adultas y adultas mayores.","Lo que me motivó a estudiar Psicología es que desde siempre he tenido una sensación muy innata de ayudar a las personas. Con el pasar de la adolescencia me fui enamorando más de este ámbito, y he realizado cada taller y proyecto con ese mismo amor que he tenido desde siempre. Lo que me mueve hoy a continuar preparándome es atender la incertidumbre en la que vive nuestra sociedad hoy en día en distintos ámbitos."],
 valores:[["Liderazgo",""],["Resolución de conflictos",""],["Pensamiento crítico",""],["Comunicación estratégica",""]],
 filosofia:["Creo de verdad que el cambio es real. Mi visión es ser un apoyo en el proceso de cada persona, y será un gusto acompañarle en ese proceso."],
 intereses:"Me interesa seguir desarrollándome en psicología organizacional y bienestar laboral, en psicología de la salud y en la intervención comunitaria con distintas poblaciones. También mantengo un interés sostenido por la neuropsicofarmacología, que me gustaría integrar a una práctica clínica y psicoeducativa responsable.",
 evolucion:"Al empezar, entendía la psicología sobre todo desde la teoría. Con el tiempo, los talleres con niñez, adolescencia, población migrante, personas adultas mayores y, ahora, contextos laborales me enseñaron que lo esencial es adaptar el lenguaje y la metodología a cada persona. El trabajo en equipo, la planificación con tiempos limitados y la necesidad de sustentar cada propuesta con evidencia me hicieron madurar como profesional. Quiero seguir fortaleciendo la evaluación de resultados de mis intervenciones, el manejo de grupos y mi criterio para decidir qué intervención corresponde en cada caso. Mi meta es ser un apoyo real en el proceso de cada persona."},

{id:"8m",n:"Taller “El 8M, ¿Por qué es importante?”",cat:"Educación para la igualdad · Infancia",col:"linear-gradient(135deg,#7a3b5e,#d17aa3)",ic:"✿",
 desc:"Taller participativo de 110 minutos para que niñas y niños comprendan el 8 de marzo y cuestionen estereotipos de género.",comp:["Diseño y facilitación de talleres","Pensamiento crítico","Educación para la igualdad"],
 id_:["Taller elaborado y ejecutado en el marco del Trabajo Comunal Universitario","2024","Elaborado y desarrollado en su totalidad por mí"],
 ctx:"Las ideas sobre lo que “corresponde” a niñas y niños se construyen desde edades tempranas en la familia, la escuela, los medios y los pares, lo que vuelve relevante intervenir educativamente desde la infancia (Carrasco Rueda et al., 2023). El 8 de marzo ofrece un marco histórico para conversar sobre derechos, igualdad y respeto.",
 obj:["General: promover en niños y niñas la comprensión del significado del 8 de marzo y de la igualdad de género, mediante actividades participativas que favorezcan el reconocimiento de derechos, el cuestionamiento de estereotipos y la expresión de mensajes de respeto.","Específicos: explorar conocimientos previos, introducir la historia de la lucha de las mujeres, cuestionar situaciones cotidianas desiguales, reconocer referentes femeninos, facilitar la expresión creativa y consolidar aprendizajes en una reflexión final."],
 fund:"Teoría del esquema de género (Bem, 1981), aprendizaje social y autoeficacia (Bandura, 1977), la revisión de la OCDE sobre estereotipos de género en la educación (Brussino y McBrien, 2022) y una revisión sistemática de intervenciones que identifica como prometedoras la participación de pares, los referentes, la interacción y los agentes de cambio (Stewart et al., 2021).",
 met:["Secuencia de seis momentos (110 minutos): bienvenida y presentación (10), cuento interactivo “La historia de Emma” (15), “Detectives de la Igualdad” (20), “Mujeres que cambiaron el mundo” (20), manualidad “Mi mensaje para el 8M” (30) y reflexión final (15).","Metodología activa: preguntas, escucha de las razones de los niños, ejemplos alternativos y producción artística."],
 part:"Elaboré y desarrollé el taller en su totalidad: definí los objetivos, organicé la secuencia de actividades, seleccioné las estrategias participativas, preparé los materiales y lo ejecuté.",
 res:["Planificación completa del taller, materiales de las seis actividades y evidencia fotográfica de la actividad artística.","Recibí retroalimentación positiva de la supervisora durante el proceso de supervisión."],
 compd:"El proyecto muestra diseño de intervenciones, facilitación con población infantil, adaptación del lenguaje y análisis crítico de estereotipos.",
 refl:"Este es el taller que diseñé y ejecuté en su totalidad, y por eso me enseñó lo que implica responsabilizarse de cada decisión: objetivos, secuencia, materiales y manejo del grupo. Aprendí que un tema como la igualdad de género con niñas y niños no se enseña explicando, sino preguntando y escuchando las razones que ellos mismos dan; por eso opté por el cuento, el análisis de situaciones y la manualidad en lugar de una exposición. Una dificultad fue traducir ideas como estereotipo o socialización de género a un lenguaje cercano a la infancia sin simplificarlas de más. Como oportunidad de mejora, incorporaría una evaluación breve antes y después, un registro de las producciones con criterios claros y un seguimiento, para no confundir la participación con evidencia de cambio. En un contexto laboral lo aplicaría así: toda intervención necesita un criterio para valorar su efecto.",
 ev:[{img:IMG[0],t:"",q:""}]},
{id:"duelo",oculto:true,n:"Taller de duelo en un hogar de personas adultas mayores",cat:"Intervención comunitaria · Adultez mayor",col:"linear-gradient(135deg,#8a4b2f,#d9895f)",ic:"❦",
 desc:"Taller “Navegando el Duelo” diseñado junto con la psicóloga del Hogar Génesis para acompañar pérdidas en la vejez.",comp:["Trabajo con instituciones","Diseño de talleres","Enfoque ético y de autonomía"],
 id_:["Trabajo final · Desarrollo, adultez y vejez (ULACIT)","2024 · Profesora Adriana Rojas","Trabajo grupal de cuatro estudiantes"],
 ctx:"El envejecimiento se asocia con pérdidas (seres queridos, capacidades, vida social). La psicóloga del Hogar Génesis solicitó un taller de duelo porque su población cambia y hacía más de tres años que no se realizaba uno. El hogar tenía 33 personas adultas mayores.",
 obj:["General: ayudar a los participantes a comprender el proceso de duelo, compartir experiencias y aprender estrategias para afrontar la pérdida y mejorar el bienestar emocional."],
 fund:"El duelo como respuesta natural y adaptativa ante la pérdida (Bowlby, 1980), el duelo complicado (Shear, 2010), la variación cultural de las prácticas de duelo (Chentsova-Dutton y Ryder, 2020) y la psicología positiva, que lo plantea también como oportunidad de crecimiento.",
 met:["Reunión previa con la psicóloga del centro (19 de junio): tema, horario (sábado por la mañana, con pausa activa), población y metodología.","Metodología acordada: no 100 % teórica, con ejemplos, imágenes e historias.","Esquema del taller: bienvenida y normas, rompehielos con ovillo de lana, comprensión del duelo y sus etapas con ejemplos, y librito con letra e imágenes grandes."],
 part:"Participé en la elaboración del taller y diseñé la actividad rompehielos del ovillo de lana (trabajo grupal).",
 res:["Esquema del taller “Navegando el Duelo: Apoyo y Estrategias para el Adulto Mayor”, minuta de la reunión y propuesta de material impreso.","Conclusión del trabajo: escucha activa y respeto a la autonomía de las personas mayores; se identificaron necesidades expresadas por los residentes, como acceso a música.","[PEGAR: observaciones de la docente y si el taller se ejecutó.]"],
 compd:"[PEGAR: cómo se manifiestan la coordinación con la institución, el diseño del taller y el enfoque ético.]",
 refl:"Este trabajo me enseñó que acompañar el duelo en la vejez empieza por escuchar a la institución y a las personas antes de proponer actividades: la reunión con la psicóloga del hogar cambió nuestro enfoque hacia una metodología menos teórica y más cercana, con ejemplos e imágenes. Aprendí a cuidar la autonomía de las personas mayores y a pensar el material en función de sus necesidades, como la letra grande del librito. Una dificultad fue equilibrar la profundidad del tema con una dinámica amable para un grupo de 33 personas. Mejoraría el proyecto planteando cómo evaluar el taller y dando seguimiento después de la sesión. Lo aplicaría en cualquier contexto de duelo, incluido el laboral, empezando por escuchar antes de intervenir."},
{id:"psf",n:"Guía práctica de psicofarmacología",cat:"Educación y psicología clínica",col:"linear-gradient(135deg,#1d4e4a,#3d8f86)",ic:"Ψ",
 desc:"Guía digital para estudiantes de psicología que organiza los fundamentos de la psicofarmacología por clases de fármacos.",comp:["Síntesis de literatura científica","Diseño de material didáctico","Diseño de instrumentos de evaluación"],
 id_:["Proyecto final integrador · Fundamentos de Psicofarmacología (ULACIT)","II cuatrimestre de 2026 · Profesora Rosa Ortiz Fonseca","Trabajo grupal de cuatro estudiantes"],
 ctx:"Según el trabajo, existía una sistematización insuficiente de los contenidos básicos de psicofarmacología para estudiantes de psicología, lo que dificulta integrar el conocimiento clínico y neurobiológico. La guía responde a esa necesidad.",
 obj:["General: desarrollar una guía práctica de psicofarmacología dirigida a estudiantes de psicología que facilite la comprensión de los fundamentos teóricos y clínicos de los psicofármacos.","Específicos: analizar los conceptos fundamentales (mecanismos de acción, clasificación y relación con procesos neurobiológicos y conductuales) y explicar la relación entre psicofármacos y trastornos mentales."],
 fund:"La guía se apoya en la psicofarmacología como parte de la formación ética y segura del psicólogo, en la teoría del aprendizaje significativo de Ausubel (1968) y en el diseño instruccional multimedia. Organiza el contenido por clases farmacológicas y usa imágenes ilustrativas de estructuras y mecanismos.",
 met:["Recurso digital interactivo con contenido por clases farmacológicas.","Evaluación planteada: cuestionario de retroalimentación (escala Likert de 5 puntos, 10 ítems) a 15–30 estudiantes de ULACIT de nivel intermedio y avanzado, por muestreo no probabilístico por conveniencia."],
 part:"Participé en la elaboración de la guía y en su testeo (trabajo grupal).",
 res:["Producto: guía práctica de psicofarmacología (digital) y materiales de presentación. La evidencia del proyecto es la guía digital publicada en línea.","La guía práctica de psicofármacos fue revisada y validada por el médico general Eugenio Díaz de León, con el fin de evaluar la información de los contenidos y su utilidad como material de apoyo para estudiantes y profesionales de Psicología. El profesional indicó que la guía presenta una estructura organizada y fácil de comprender, con información adecuada y clara sobre los diferentes grupos de psicofármacos, y un diseño visual que facilita la lectura y los contenidos."],
 links:[{label:"Abrir la guía digital interactiva",url:"https://guiadepsicofarmacos.netlify.app/"}],
 compd:"La guía evidencia síntesis de literatura científica, diseño de un recurso didáctico y diseño de un instrumento de retroalimentación, además de trabajo en equipo.",
 refl:"Elaborar y testear la guía me obligó a pasar de estudiar psicofarmacología a explicarla, y eso exige comprenderla mejor. Aprendí a organizar información compleja por clases farmacológicas y a pensar en quien la va a usar: estudiantes de psicología que necesitan una herramienta práctica. El testeo me mostró que lo que parece claro para quien escribe no siempre lo es para quien lee. Una dificultad fue equilibrar el rigor científico con la sencillez. Mejoraría ampliando la muestra de testeo y registrando de forma sistemática la retroalimentación. Lo aplicaría al diseñar material psicoeducativo en un contexto laboral, siempre dentro de los límites del rol del psicólogo, que acompaña y orienta, pero no prescribe."},
{id:"cron",n:"Manual didáctico: “Salud con Calma: Estrategias para una Vida Plena”",cat:"Psicología de la salud · Estrés y enfermedad crónica",col:"linear-gradient(135deg,#4b3b6b,#8e7ab8)",ic:"≈",
 desc:"Manual sobre estrés, enfermedades crónicas y estrategias de autorregulación, con prevención en tres niveles y dinámicas grupales.",comp:["Psicología de la salud","Psicoeducación","Prevención en tres niveles"],
 id_:["Trastornos Crónicos (ULACIT)","I cuatrimestre de 2026 · Dra. Rebeca Ramírez","Trabajo grupal de cinco estudiantes"],
 ctx:"El manual relaciona el estrés crónico con enfermedades como hipertensión, diabetes tipo 2 y dolor crónico, y con la vulnerabilidad, la soledad y la carga alostática en la adultez mayor.",
 obj:["General: identificar y regular el estrés en población adulta mayor."],
 fund:"Definición de estrés desde la psicología y la fisiología, liberación de cortisol, efectos del estrés prolongado en los sistemas inmune, cardiovascular y metabólico, estrés acumulativo en el ciclo vital, prevención primaria, secundaria y terciaria, enfoque biopsicosocial y rol del psicólogo en la prevención. Para el manejo del estrés incluye reducción de estrés basada en mindfulness (MBSR), yoga, tai chi, relajación progresiva y control respiratorio.",
 met:["Marco teórico de 51 páginas seguido de actividades didácticas con objetivo, descripción, instrucciones, recursos y duración.","Ejemplos de actividades: “La Red del Estrés: Tejiendo Conexiones” (dinámica del hilo), “Lluvia de ideas: estrés y enfermedad” y “Mapa personal de estresores”."],
 part:"Participé en la elaboración del taller y diseñé la actividad “La rueda de las emociones” (trabajo grupal).",
 res:["Manual didáctico de 71 páginas con marco teórico, actividades didácticas y referencias.","Retroalimentación de la docente: muy buen trabajo y excelente implementación de técnicas."],
 compd:"El manual evidencia psicoeducación sobre estrés y salud, diseño de actividades grupales y comprensión de la prevención en tres niveles desde el enfoque biopsicosocial.",refl:"Este manual me ayudó a entender el estrés como un fenómeno biopsicosocial: no es solo emocional, también afecta los sistemas inmune, cardiovascular y metabólico, y se acumula a lo largo del ciclo vital. Aprendí a convertir un marco teórico extenso en actividades concretas, como la dinámica del hilo o el mapa personal de estresores. Una dificultad fue sostener la coherencia del manual entre cinco integrantes y un marco teórico tan amplio. Mejoraría validando las actividades con población real y definiendo indicadores para valorar su efecto. Lo aplicaría directamente en bienestar laboral, donde la prevención del estrés en sus tres niveles es una necesidad concreta."
 ,ev:[{img:IMG[1],t:"Presentación a un grupo de personas adultas mayores",q:"Evidencia de la aplicación de la propuesta con población adulta mayor. [CONFIRMAR: qué parte presentaste tú y la autorización de uso de la imagen.]"}]},
{id:"env",n:"Manual didáctico: “Renovando Caminos: Vida y Esperanza en la Adultez Mayor”",cat:"Prevención · Salud mental en la vejez",col:"linear-gradient(135deg,#34495e,#6c8fb0)",ic:"✦",
 desc:"Manual con marco teórico y actividades didácticas para prevenir la conducta suicida en personas mayores.",comp:["Prevención en salud mental","Marco teórico biopsicosocial","Diseño de actividades didácticas"],
 id_:["Envejecimiento: aspectos biopsicosociales (ULACIT)","I cuatrimestre de 2026 · Dra. Rebeca Ramírez","Trabajo grupal de cuatro estudiantes"],
 ctx:"El manual aborda envejecimiento, depresión, duelo y conducta suicida en personas mayores como problema de salud mental que requiere prevención.",
 obj:["General: diseñar, desarrollar e implementar el taller “Renovando Caminos: Vida y Esperanza en la Adultez Mayor”, con el propósito de promover el bienestar emocional, fortalecer los factores protectores frente a la depresión, la soledad y la conducta suicida, y fomentar el sentido de vida, las redes de apoyo y el envejecimiento saludable en las personas adultas mayores mediante actividades psicoeducativas y participativas."],
 fund:"Envejecimiento biológico, psicológico y social, edadismo, depresión, duelo, factores de riesgo y protectores, teoría interpersonal del suicidio (Joiner), modelo ecológico, enfoque biopsicosocial, niveles de prevención y abordaje interdisciplinario.",
 met:["Marco teórico y actividades didácticas con objetivo y descripción.","Ejemplos: “Mi nombre y una razón para cuidar la vida” y “Señal de riesgo o factor protector”."],
 part:"Mi participación consistió en la elaboración y desarrollo del taller, incluyendo la planificación de las actividades didácticas y los contenidos psicoeducativos. Además, estuve a cargo de la actividad “Señal de riesgo o factor protector” (bandera roja y verde), orientada a que las personas participantes identificaran señales de riesgo y factores protectores relacionados con la salud mental y el bienestar en la adultez mayor.",
 res:["Manual de 58 páginas con marco teórico, actividades didácticas, referencias y anexos.","Retroalimentación de la docente: El trabajo demuestra una adecuada integración de conocimientos teóricos y propuestas prácticas, abordando una temática de gran relevancia social. Se reconoce el esfuerzo investigativo y la intención de desarrollar herramientas que contribuyan al bienestar psicológico y social de las personas adultas mayores. Como aspecto de mejora, se recomienda fortalecer la precisión académica de algunas secciones y asegurar que exista una correspondencia directa entre los objetivos, los contenidos desarrollados y las actividades propuestas."],
 compd:"El manual evidencia conocimiento del envejecimiento y la salud mental en la vejez, enfoque preventivo y diseño de actividades didácticas con enfoque biopsicosocial.",refl:"Este manual me enseñó a abordar con rigor y cuidado un tema delicado: la conducta suicida en personas mayores. Aprendí a mirarla desde la prevención, distinguiendo factores de riesgo y factores protectores, y a entender por qué el trabajo interdisciplinario y el enfoque biopsicosocial importan tanto. Una dificultad fue usar un lenguaje responsable y esperanzador sin minimizar el problema. Mejoraría contando con la revisión de profesionales del área y probando las actividades con un grupo real. Lo aplicaría en cualquier contexto de acompañamiento, incluido el laboral, atento a señales de riesgo y a los factores que protegen a las personas."
 ,ev:[{img:IMG[2],t:"Sesión con personas adultas mayores",q:"Evidencia de la sesión realizada con población adulta mayor."}]}],

 educ:["Licenciatura en Psicología · ULACIT · 2026 – actualidad","Bachillerato en Psicología · ULACIT · 2024 – 2025","Bachillerato en Psicología · Universidad Autónoma de Centroamérica · 2022 – 2024"],

const links=[...document.querySelectorAll("nav a.l")];
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)links.forEach(l=>l.classList.toggle("on",l.dataset.s===x.target.id))}),{rootMargin:"-45% 0px -50% 0px"});
